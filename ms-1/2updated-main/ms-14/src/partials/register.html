<!-- PRE-REGISTER -->
<section id="register">
  <div class="register-wrap reveal">
    <div class="section-tag" style="justify-content:center">Get Early Access</div>
    <h2 class="section-title-main" style="text-align:center">Register Your<br><span class="outline">Interest.</span></h2>
    <p class="register-sub">Be first to know when the Omniverse goes live. Drop your email — no spam, just the moments that matter.</p>
    <form class="register-form" id="hero-register-form">
      <input type="email" id="hero-register-email" class="register-input" placeholder="Enter your email" required>
      <button type="submit" class="register-btn">Register Interest</button>
    </form>
    <div class="register-consent">
      <input type="checkbox" id="hero-register-consent" required>
      <label for="hero-register-consent">I agree to the <a onclick="openLegalModal('terms')">Terms &amp; Conditions</a> and <a onclick="openLegalModal('privacy')">Privacy Policy</a>, and consent to Mad Sensei Studios storing my email to send updates.</label>
    </div>
    <p class="register-msg" id="hero-register-msg"></p>
  </div>
</section>
