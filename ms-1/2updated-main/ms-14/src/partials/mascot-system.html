<!-- ==================== MASCOT SYSTEM & SENSEITRIX ==================== -->

<!-- MASCOT SENSEITRIX SELECTION SCREEN -->
<div id="senseitrix-screen" style="
  position:fixed;inset:0;z-index:199999;
  background:#000;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
">
  <!-- Space background canvas -->
  <canvas id="space-canvas" style="position:absolute;inset:0;z-index:0;"></canvas>
  
  <!-- Scan lines -->
  <div style="position:absolute;inset:0;z-index:1;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,180,0.015) 3px,rgba(0,255,180,0.015) 4px);
    pointer-events:none;"></div>
  
  <!-- Logo area - Stylized MAD SENSEI Logo -->
  <div style="position:relative;z-index:2;text-align:center;margin-bottom:20px;">
    <!-- SVG Logo Mark -->
    <svg viewBox="0 0 360 100" style="width:min(360px,80vw);height:auto;margin-bottom:8px;" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="logo-glow">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgba(200,168,75,0.6)"/>
          <stop offset="50%" style="stop-color:rgba(255,224,100,1)"/>
          <stop offset="100%" style="stop-color:rgba(200,168,75,0.6)"/>
        </linearGradient>
      </defs>
      <!-- Decorative top lines -->
      <line x1="10" y1="15" x2="130" y2="15" stroke="rgba(200,168,75,0.3)" stroke-width="0.5"/>
      <line x1="230" y1="15" x2="350" y2="15" stroke="rgba(200,168,75,0.3)" stroke-width="0.5"/>
      <!-- Corner marks -->
      <path d="M10,20 L10,10 L20,10" stroke="rgba(200,168,75,0.7)" stroke-width="1" fill="none"/>
      <path d="M340,10 L350,10 L350,20" stroke="rgba(200,168,75,0.7)" stroke-width="1" fill="none"/>
      <path d="M10,80 L10,90 L20,90" stroke="rgba(200,168,75,0.7)" stroke-width="1" fill="none"/>
      <path d="M340,90 L350,90 L350,80" stroke="rgba(200,168,75,0.7)" stroke-width="1" fill="none"/>
      <!-- Graduation cap icon -->
      <text x="180" y="18" text-anchor="middle" font-size="16" fill="rgba(200,168,75,0.8)" filter="url(#logo-glow)">🎓</text>
      <!-- Main kanji -->
      <text x="180" y="62" text-anchor="middle" font-family="'Noto Serif JP',serif" font-size="38" font-weight="900"
        fill="url(#logo-grad)" filter="url(#logo-glow)" letter-spacing="0.08em">狂賢師</text>
      <!-- Studio name -->
      <text x="180" y="83" text-anchor="middle" font-family="'Share Tech Mono',monospace" font-size="9"
        fill="rgba(200,168,75,0.7)" letter-spacing="0.35em">MAD SENSEI STUDIOS</text>
      <!-- Decorative bottom line -->
      <line x1="50" y1="92" x2="310" y2="92" stroke="rgba(200,168,75,0.2)" stroke-width="0.5"/>
    </svg>
    <div style="
      font-family:'Share Tech Mono',monospace;font-size:clamp(8px,1.5vw,11px);
      letter-spacing:0.55em;color:rgba(0,255,200,0.7);margin-top:4px;
      text-transform:uppercase;
    ">⬡ SENSEITRIX  ·  SELECT YOUR COMPANION  ·  ⬡</div>
  </div>
  
  <!-- SENSEITRIX DEVICE -->
  <div id="senseitrix-device" style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;">
    
    <!-- BEN 10 OMNIVERSE DIGITAL DIAL WHEEL -->
    <div id="omni-faceplate" style="
      position:relative;width:min(420px,86vw);height:min(420px,86vw);
      display:flex;align-items:center;justify-content:center;
    ">
      <svg id="omni-dial-svg" viewBox="0 0 420 420" style="position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible;" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="gd1"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="gd2"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <radialGradient id="dial-bg-grad" cx="50%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#0d3a25"/>
            <stop offset="70%" stop-color="#061a0f"/>
            <stop offset="100%" stop-color="#020b06"/>
          </radialGradient>
          <linearGradient id="seg-on" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(0,255,157,0.85)"/>
            <stop offset="100%" stop-color="rgba(0,190,110,0.55)"/>
          </linearGradient>
          <linearGradient id="seg-off" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(0,60,38,0.4)"/>
            <stop offset="100%" stop-color="rgba(0,25,15,0.25)"/>
          </linearGradient>
          <clipPath id="hex-face-clip">
            <polygon points="210,72 285,113 285,195 210,236 135,195 135,113"/>
          </clipPath>
          <clipPath id="hex-mascot-clip">
            <polygon points="210,155 276,193 276,269 210,307 144,269 144,193"/>
          </clipPath>
        </defs>

        <!-- ── Outer background disc ── -->
        <circle cx="210" cy="210" r="206" fill="rgba(0,12,7,0.97)" stroke="rgba(0,255,157,0.1)" stroke-width="1"/>

        <!-- ── 6 PIE SEGMENT SLICES (the dial positions) ── -->
        <!-- Segment 0: top (0°, IP: 魂 TAMASHII) -->
        <g class="dial-seg" id="dial-seg-0" onclick="dialClick(0)" style="cursor:pointer;">
          <path d="M210,210 L183,28 A185,185 0 0,1 237,28 Z" fill="url(#seg-off)" stroke="rgba(0,255,157,0.25)" stroke-width="0.8" stroke-linejoin="round"/>
          <circle cx="210" cy="48" r="22" fill="rgba(0,30,18,0.9)" stroke="rgba(0,255,157,0.4)" stroke-width="1.5" filter="url(#gd1)"/>
          <text x="210" y="55" text-anchor="middle" font-family="'Noto Serif JP',serif" font-size="17" font-weight="900" fill="rgba(0,255,157,0.7)">魂</text>
        </g>
        <!-- Segment 1: upper-right (60°, IP: 炎 KAEN) -->
        <g class="dial-seg" id="dial-seg-1" onclick="dialClick(1)" style="cursor:pointer;">
          <path d="M210,210 L384,120 A185,185 0 0,1 395,175 Z" fill="url(#seg-off)" stroke="rgba(0,255,157,0.25)" stroke-width="0.8"/>
          <circle cx="376" cy="130" r="22" fill="rgba(0,30,18,0.9)" stroke="rgba(0,255,157,0.4)" stroke-width="1.5" filter="url(#gd1)"/>
          <text x="376" y="137" text-anchor="middle" font-family="'Noto Serif JP',serif" font-size="17" font-weight="900" fill="rgba(0,255,157,0.7)">炎</text>
        </g>
        <!-- Segment 2: lower-right (120°, IP: 影 KAGE) -->
        <g class="dial-seg" id="dial-seg-2" onclick="dialClick(2)" style="cursor:pointer;">
          <path d="M210,210 L395,255 A185,185 0 0,1 360,370 Z" fill="url(#seg-off)" stroke="rgba(0,255,157,0.25)" stroke-width="0.8"/>
          <circle cx="375" cy="335" r="22" fill="rgba(0,30,18,0.9)" stroke="rgba(0,255,157,0.4)" stroke-width="1.5" filter="url(#gd1)"/>
          <text x="375" y="342" text-anchor="middle" font-family="'Noto Serif JP',serif" font-size="17" font-weight="900" fill="rgba(0,255,157,0.7)">影</text>
        </g>
        <!-- Segment 3: bottom (180°, IP: 嵐 ARASHI) -->
        <g class="dial-seg" id="dial-seg-3" onclick="dialClick(3)" style="cursor:pointer;">
          <path d="M210,210 L237,392 A185,185 0 0,1 183,392 Z" fill="url(#seg-off)" stroke="rgba(0,255,157,0.25)" stroke-width="0.8"/>
          <circle cx="210" cy="383" r="22" fill="rgba(0,30,18,0.9)" stroke="rgba(0,255,157,0.4)" stroke-width="1.5" filter="url(#gd1)"/>
          <text x="210" y="390" text-anchor="middle" font-family="'Noto Serif JP',serif" font-size="17" font-weight="900" fill="rgba(0,255,157,0.7)">嵐</text>
        </g>
        <!-- Segment 4: lower-left (240°, IP: 夢 YUME) -->
        <g class="dial-seg" id="dial-seg-4" onclick="dialClick(4)" style="cursor:pointer;">
          <path d="M210,210 L60,370 A185,185 0 0,1 25,255 Z" fill="url(#seg-off)" stroke="rgba(0,255,157,0.25)" stroke-width="0.8"/>
          <circle cx="45" cy="335" r="22" fill="rgba(0,30,18,0.9)" stroke="rgba(0,255,157,0.4)" stroke-width="1.5" filter="url(#gd1)"/>
          <text x="45" y="342" text-anchor="middle" font-family="'Noto Serif JP',serif" font-size="17" font-weight="900" fill="rgba(0,255,157,0.7)">夢</text>
        </g>
        <!-- Segment 5: upper-left (300°, IP: 神 KAMI) -->
        <g class="dial-seg" id="dial-seg-5" onclick="dialClick(5)" style="cursor:pointer;">
          <path d="M210,210 L25,165 A185,185 0 0,1 36,120 Z" fill="url(#seg-off)" stroke="rgba(0,255,157,0.25)" stroke-width="0.8"/>
          <circle cx="44" cy="130" r="22" fill="rgba(0,30,18,0.9)" stroke="rgba(0,255,157,0.4)" stroke-width="1.5" filter="url(#gd1)"/>
          <text x="44" y="137" text-anchor="middle" font-family="'Noto Serif JP',serif" font-size="17" font-weight="900" fill="rgba(0,255,157,0.7)">神</text>
        </g>

        <!-- ── OUTER ROTATING TECH RING ── -->
        <g style="transform-origin:210px 210px;animation:omni-gear-spin 10s linear infinite;">
          <circle cx="210" cy="210" r="200" fill="none" stroke="rgba(0,255,157,0.3)" stroke-width="1.5"/>
          <circle cx="210" cy="210" r="196" fill="none" stroke="rgba(0,255,157,0.07)" stroke-width="1" stroke-dasharray="3 9"/>
          <line x1="210" y1="12" x2="210" y2="32" stroke="rgba(0,255,157,0.8)" stroke-width="2.5" transform="rotate(0 210 210)" filter="url(#gd1)"/>
          <line x1="210" y1="12" x2="210" y2="32" stroke="rgba(0,255,157,0.8)" stroke-width="2.5" transform="rotate(60 210 210)" filter="url(#gd1)"/>
          <line x1="210" y1="12" x2="210" y2="32" stroke="rgba(0,255,157,0.8)" stroke-width="2.5" transform="rotate(120 210 210)" filter="url(#gd1)"/>
          <line x1="210" y1="12" x2="210" y2="32" stroke="rgba(0,255,157,0.8)" stroke-width="2.5" transform="rotate(180 210 210)" filter="url(#gd1)"/>
          <line x1="210" y1="12" x2="210" y2="32" stroke="rgba(0,255,157,0.8)" stroke-width="2.5" transform="rotate(240 210 210)" filter="url(#gd1)"/>
          <line x1="210" y1="12" x2="210" y2="32" stroke="rgba(0,255,157,0.8)" stroke-width="2.5" transform="rotate(300 210 210)" filter="url(#gd1)"/>
          <line x1="210" y1="14" x2="210" y2="22" stroke="rgba(0,255,157,0.3)" stroke-width="1" transform="rotate(30 210 210)"/>
          <line x1="210" y1="14" x2="210" y2="22" stroke="rgba(0,255,157,0.3)" stroke-width="1" transform="rotate(90 210 210)"/>
          <line x1="210" y1="14" x2="210" y2="22" stroke="rgba(0,255,157,0.3)" stroke-width="1" transform="rotate(150 210 210)"/>
          <line x1="210" y1="14" x2="210" y2="22" stroke="rgba(0,255,157,0.3)" stroke-width="1" transform="rotate(210 210 210)"/>
          <line x1="210" y1="14" x2="210" y2="22" stroke="rgba(0,255,157,0.3)" stroke-width="1" transform="rotate(270 210 210)"/>
          <line x1="210" y1="14" x2="210" y2="22" stroke="rgba(0,255,157,0.3)" stroke-width="1" transform="rotate(330 210 210)"/>
        </g>

        <!-- ── COUNTER-SPINNING INNER RING ── -->
        <g style="transform-origin:210px 210px;animation:omni-gear-counter 14s linear infinite;">
          <circle cx="210" cy="210" r="174" fill="none" stroke="rgba(0,255,157,0.1)" stroke-width="1" stroke-dasharray="4 6"/>
        </g>

        <!-- ── HEX FACEPLATE (central hexagon) ── -->
        <polygon points="210,70 288,114 288,202 210,246 132,202 132,114"
          fill="url(#dial-bg-grad)" stroke="rgba(0,255,157,0.65)" stroke-width="2" filter="url(#gd1)"/>
        <!-- Inner hex bevel -->
        <polygon points="210,82 278,122 278,196 210,236 142,196 142,122"
          fill="none" stroke="rgba(0,255,157,0.2)" stroke-width="1"/>

        <!-- ── SENSEITRIX HOURGLASS LOGO (top half of hex) ── -->
        <g filter="url(#gd2)">
          <polygon points="210,88 240,105 240,139 210,156 180,139 180,105"
            fill="rgba(0,18,10,0.85)" stroke="rgba(0,255,157,0.6)" stroke-width="1.5"/>
          <path d="M197,99 L223,99 L210,122 L223,145 L197,145 L210,122 Z"
            fill="rgba(0,255,157,0.18)" stroke="rgba(0,255,157,0.9)" stroke-width="1.5"/>
          <circle cx="210" cy="122" r="4.5" fill="rgba(0,255,157,1)"/>
          <!-- Rotating accent ring on hourglass -->
          <circle cx="210" cy="122" r="18" fill="none" stroke="rgba(0,255,157,0.2)"
            stroke-width="0.8" stroke-dasharray="4 6"
            style="animation:omni-gear-spin 5s linear infinite;transform-origin:210px 122px;"/>
        </g>

        <!-- ── MASCOT PREVIEW IMAGE (lower hex half) ── -->
        <image id="omni-mascot-img" x="140" y="155" width="140" height="155"
          preserveAspectRatio="xMidYMin slice" clip-path="url(#hex-mascot-clip)"
          style="transition:opacity 0.35s ease;opacity:0;"/>
        <!-- Hex border over mascot -->
        <polygon points="210,155 276,193 276,269 210,307 144,269 144,193"
          fill="none" stroke="rgba(0,255,157,0.55)" stroke-width="1.5" filter="url(#gd1)"/>
        <!-- Scanning line animation -->
        <rect id="omni-scan-bar" x="144" y="155" width="132" height="2"
          fill="rgba(0,255,157,0.7)" filter="url(#gd1)"
          style="animation:scan-hex 2.2s ease-in-out infinite;"/>

        <!-- ── DIGITAL READOUT PANEL ── -->
        <rect x="138" y="315" width="144" height="32" rx="3"
          fill="rgba(0,10,6,0.95)" stroke="rgba(0,255,157,0.3)" stroke-width="1"/>
        <!-- Scanline texture overlay (simulated with thin rect) -->
        <rect x="139" y="316" width="142" height="30" rx="2" fill="rgba(0,255,157,0.02)"/>
        <text id="omni-display-name" x="210" y="335" text-anchor="middle"
          font-family="'Share Tech Mono',monospace" font-size="10.5" letter-spacing="0.22em"
          fill="rgba(0,255,157,0.95)" filter="url(#gd1)">◈ SELECT ◈</text>
        <text id="omni-display-trait" x="210" y="354" text-anchor="middle"
          font-family="'Share Tech Mono',monospace" font-size="6.5" letter-spacing="0.18em"
          fill="rgba(0,200,120,0.55)">· COMPANION SYSTEM ONLINE ·</text>

        <!-- ── SELECTION POINTER ARROW (rotates to active segment) ── -->
        <g id="omni-pointer" style="transform-origin:210px 210px;transition:transform 0.55s cubic-bezier(0.34,1.56,0.64,1);">
          <line x1="210" y1="162" x2="210" y2="104" stroke="rgba(0,255,157,0.75)" stroke-width="1.5" filter="url(#gd1)"/>
          <polygon points="210,92 204,110 216,110" fill="rgba(0,255,157,0.95)" filter="url(#gd2)"/>
        </g>

        <!-- ── CORNER HEX NOTCHES ── -->
        <g fill="rgba(0,255,157,0.5)" filter="url(#gd1)">
          <polygon points="132,114 144,114 132,126"/>
          <polygon points="288,114 276,114 288,126"/>
          <polygon points="132,202 144,202 132,190"/>
          <polygon points="288,202 276,202 288,190"/>
        </g>
      </svg>

      <!-- Scan hex animation keyframe -->
    </div>

    <!-- CHARACTER CARD GRID — primary selection -->
    <div style="margin-top:18px;width:100%;">
      <div style="font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:0.45em;color:rgba(0,255,157,0.4);text-align:center;margin-bottom:10px;text-transform:uppercase;">// SELECT YOUR COMPANION</div>
      <div id="omni-selectors"></div>
    </div>
    
    <!-- Dial rotation arrows -->
    <div style="display:flex;gap:40px;margin-top:14px;align-items:center;">
      <button id="omni-prev" style="
        font-family:'Share Tech Mono',monospace;font-size:13px;
        letter-spacing:0.3em;color:rgba(0,255,157,0.85);
        background:rgba(0,25,15,0.85);
        border:1px solid rgba(0,255,157,0.45);
        border-radius:5px;
        padding:10px 22px;cursor:pointer;transition:all 0.2s;
        box-shadow:0 0 12px rgba(0,255,157,0.12);
      " onmouseenter="this.style.boxShadow='0 0 22px rgba(0,255,157,0.45)';this.style.borderColor='rgba(0,255,157,0.9)';this.style.color='rgba(0,255,157,1)'"
        onmouseleave="this.style.boxShadow='0 0 12px rgba(0,255,157,0.12)';this.style.borderColor='rgba(0,255,157,0.45)';this.style.color='rgba(0,255,157,0.85)'"
      >⟨ PREV</button>
      <div style="
        font-family:'Share Tech Mono',monospace;font-size:9px;
        letter-spacing:0.4em;color:rgba(0,255,180,0.5);text-align:center;
      ">ROTATE DIAL</div>
      <button id="omni-next" style="
        font-family:'Share Tech Mono',monospace;font-size:13px;
        letter-spacing:0.3em;color:rgba(0,255,157,0.85);
        background:rgba(0,25,15,0.85);
        border:1px solid rgba(0,255,157,0.45);
        border-radius:5px;
        padding:10px 22px;cursor:pointer;transition:all 0.2s;
        box-shadow:0 0 12px rgba(0,255,157,0.12);
      " onmouseenter="this.style.boxShadow='0 0 22px rgba(0,255,157,0.45)';this.style.borderColor='rgba(0,255,157,0.9)';this.style.color='rgba(0,255,157,1)'"
        onmouseleave="this.style.boxShadow='0 0 12px rgba(0,255,157,0.12)';this.style.borderColor='rgba(0,255,157,0.45)';this.style.color='rgba(0,255,157,0.85)'"
      >NEXT ⟩</button>
    </div>
    
    <!-- Selected character info banner -->
    <div id="omni-info" style="
      margin-top:10px;text-align:center;width:min(500px,90vw);
      background:rgba(0,15,10,0.85);
      border:0.5px solid rgba(0,255,157,0.25);
      border-radius:8px;
      padding:10px 18px;
      backdrop-filter:blur(12px);
      display:flex;align-items:center;gap:14px;
      box-shadow:inset 0 0 30px rgba(0,255,157,0.03), 0 0 20px rgba(0,0,0,0.5);
    ">
      <!-- Mini character portrait -->
      <div id="omni-info-portrait" style="
        width:54px;height:72px;border-radius:6px;overflow:hidden;flex-shrink:0;
        border:1px solid rgba(0,255,157,0.3);
        background:rgba(0,20,12,0.9);
      ">
        <img id="omni-info-portrait-img" style="width:100%;height:100%;object-fit:cover;object-position:top center;" src="" alt="">
      </div>
      <!-- Text info -->
      <div style="flex:1;text-align:left;min-width:0;">
        <div id="omni-char-name" style="
          font-family:'Noto Serif JP',serif;font-size:clamp(14px,2.5vw,18px);font-weight:900;
          color:rgba(0,255,200,0.95);margin-bottom:2px;
        "></div>
        <div id="omni-char-trait" style="
          font-family:'Share Tech Mono',monospace;font-size:8px;
          letter-spacing:0.3em;color:rgba(200,168,75,0.7);margin-bottom:5px;
        "></div>
        <div id="omni-char-desc" style="
          font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:300;
          color:rgba(232,228,216,0.55);line-height:1.5;
          overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
        "></div>
      </div>
      <div id="omni-status-text" style="
        font-family:'Share Tech Mono',monospace;font-size:7px;
        letter-spacing:0.2em;color:rgba(0,255,157,0.35);
        writing-mode:vertical-rl;text-orientation:mixed;
        flex-shrink:0;
      ">// AWAITING</div>
    </div>
    
    <!-- CONFIRM BUTTON — the SenseiTrix press! -->
    <button id="omni-confirm" class="omni-confirm-btn">
      ⬡ LOCK ON ⬡
    </button>
    <!-- Wrist band decoration -->
    <div class="omni-wrist-band">
      <div class="omni-wrist-led"></div>
      <div style="font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:0.3em;color:rgba(0,255,157,0.4);">SENSEITRIX · v1.0</div>
      <div class="omni-wrist-led"></div>
    </div>
    <div style="font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:0.2em;color:rgba(0,255,157,0.3);margin-top:8px;text-align:center;">
      ← → ARROWS · ENTER TO LOCK · CLICK FACE TO CONFIRM
    </div>
  </div>
</div>

<!-- MASCOT COMPANION (floats on all pages) -->
<div id="mascot-companion" style="
  position:fixed;bottom:20px;right:20px;z-index:9999;
  width:140px;
  display:none;flex-direction:column;align-items:center;
  pointer-events:all;user-select:none;
">
  <!-- Speech bubble -->
  <div id="mascot-bubble" style="
    position:absolute;bottom:170px;right:0;
    max-width:240px;min-width:140px;
    background:rgba(5,5,5,0.97);
    border:1px solid rgba(200,168,75,0.5);
    border-radius:4px;
    padding:12px 16px;
    font-family:'Rajdhani',sans-serif;
    font-size:13px;line-height:1.55;
    color:rgba(232,228,216,0.95);
    opacity:0;transition:opacity 0.4s ease;
    pointer-events:none;text-align:center;
    box-shadow:0 0 30px rgba(200,168,75,0.15), 0 4px 20px rgba(0,0,0,0.5);
  ">
    <div style="position:absolute;bottom:-7px;right:22px;width:12px;height:12px;
      background:rgba(5,5,5,0.97);
      border-right:1px solid rgba(200,168,75,0.5);
      border-bottom:1px solid rgba(200,168,75,0.5);
      transform:rotate(45deg);"></div>
    <span id="bubble-text"></span>
  </div>
  
  <!-- Mascot sprite (the full sprite sheet, cropped to show one expression) -->
  <div id="mascot-sprite-wrap" style="
    width:130px;height:150px;cursor:pointer;
    filter:drop-shadow(0 0 12px rgba(200,168,75,0.35));
    transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    animation:mascot-float 3s ease-in-out infinite;
    position:relative;
  ">
    <img id="mascot-sprite" style="
      width:100%;height:100%;
      object-fit:contain;object-position:top center;
    " src="" alt="Mascot"/>
    <!-- Shine effect on hover -->
    <div id="mascot-shine" style="
      position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,0.12) 0%,transparent 50%);
      pointer-events:none;opacity:0;transition:opacity 0.3s;
    "></div>
  </div>
  
  <!-- Mascot name label + personality -->
  <div id="mascot-label" style="
    font-family:'Share Tech Mono',monospace;font-size:9px;
    letter-spacing:0.3em;color:rgba(200,168,75,0.7);
    margin-top:6px;text-align:center;
  "></div>
  <div id="mascot-trait-label" style="
    font-family:'Rajdhani',sans-serif;font-size:9px;font-weight:600;
    letter-spacing:0.1em;color:rgba(200,168,75,0.4);
    margin-top:2px;text-align:center;max-width:130px;
    text-overflow:ellipsis;overflow:hidden;white-space:nowrap;
  "></div>
  
  <!-- Change mascot / SenseiTrix button -->
  <div onclick="openSenseitrix()" style="
    font-family:'Share Tech Mono',monospace;font-size:7px;
    letter-spacing:0.25em;color:rgba(0,255,157,0.5);
    margin-top:4px;cursor:pointer;text-align:center;
    border:0.5px solid rgba(0,255,157,0.3);padding:4px 10px;
    border-radius:2px;transition:all 0.2s;
    display:flex;align-items:center;gap:6px;
  " onmouseenter="this.style.color='rgba(0,255,157,0.95)';this.style.borderColor='rgba(0,255,157,0.7)';this.style.boxShadow='0 0 10px rgba(0,255,157,0.3)'"
    onmouseleave="this.style.color='rgba(0,255,157,0.5)';this.style.borderColor='rgba(0,255,157,0.3)';this.style.boxShadow='none'">
    <svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 9.3,2.5 9.3,7.5 5,10 0.7,7.5 0.7,2.5" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="5" cy="5" r="2" fill="currentColor" opacity="0.6"/></svg>
    SWITCH
  </div>
</div>

<!-- MUSIC PLAYER -->
<div id="music-player" style="
  position:fixed;bottom:20px;left:20px;z-index:9998;
  background:rgba(5,5,5,0.97);
  border:0.5px solid rgba(200,168,75,0.35);
  border-radius:6px;
  padding:10px 14px;display:none;align-items:center;gap:10px;
  backdrop-filter:blur(16px);
  box-shadow:0 0 30px rgba(200,168,75,0.12), 0 4px 16px rgba(0,0,0,0.6);
">
  <audio id="bg-music" loop><source src="bg-music.mp3" type="audio/mpeg"></audio>
  <button id="music-toggle" onclick="toggleMusic()" style="
    font-family:'Share Tech Mono',monospace;font-size:14px;
    color:var(--gold);background:none;border:none;cursor:pointer;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    transition:all 0.2s;
  ">▶</button>
  <div>
    <div style="font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:0.3em;color:var(--gold);">MAD SENSEI OST</div>
    <div id="music-status" style="font-family:'Rajdhani',sans-serif;font-size:11px;color:rgba(232,228,216,0.5);">Theme Song</div>
  </div>
  <input type="range" min="0" max="1" step="0.05" value="0.5" 
    oninput="document.getElementById('bg-music').volume=this.value"
    style="width:56px;height:2px;accent-color:var(--gold);cursor:pointer;opacity:0.7;" title="Volume"/>
  <div id="music-bars" style="display:flex;gap:2px;align-items:center;height:16px;">
    <div style="width:3px;background:rgba(200,168,75,0.6);animation:music-bar 0.8s ease infinite;animation-play-state:paused;" class="mbar"></div>
    <div style="width:3px;background:rgba(200,168,75,0.6);animation:music-bar 0.8s ease 0.1s infinite;animation-play-state:paused;" class="mbar"></div>
    <div style="width:3px;background:rgba(200,168,75,0.6);animation:music-bar 0.8s ease 0.2s infinite;animation-play-state:paused;" class="mbar"></div>
    <div style="width:3px;background:rgba(200,168,75,0.6);animation:music-bar 0.8s ease 0.3s infinite;animation-play-state:paused;" class="mbar"></div>
    <div style="width:3px;background:rgba(200,168,75,0.6);animation:music-bar 0.8s ease 0.4s infinite;animation-play-state:paused;" class="mbar"></div>
  </div>
</div>
